<style>
        .paper-texture {
            background-color: #E8D9C5;
            background-image: 
                radial-gradient(#c4b29c 1px, transparent 1px),
                radial-gradient(#c4b29c 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        
        .hard-shadow {
            box-shadow: 4px 4px 0px #000000;
        }
        
        .stamp-overlay {
            border: 4px solid #991B1B;
            color: #991B1B;
            padding: 4px 8px;
            text-transform: uppercase;
            font-weight: bold;
            opacity: 0.8;
            transform: rotate(-12deg);
            display: inline-block;
        }

        .dead-filter {
            filter: grayscale(100%) contrast(120%) opacity(0.8);
        }
        
        .taped-note::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            width: 60px;
            height: 20px;
            background-color: rgba(250, 204, 21, 0.7);
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            z-index: 10;
        }
        
        body {
            /* Desk background */
            background-color: #2c2524;
            background-image: linear-gradient(45deg, #1f1a19 25%, transparent 25%, transparent 75%, #1f1a19 75%, #1f1a19), linear-gradient(45deg, #1f1a19 25%, transparent 25%, transparent 75%, #1f1a19 75%, #1f1a19);

            background-position: 0 0, 20px 20px;

<body class="min-h-screen w-full flex flex-col items-center py-margin-dossier px-gutter-mobile overflow-x-hidden">
<!-- The Manila Folder Canvas -->
<main class="w-full max-w-md paper-texture border-4 border-black shadow-[0_20px_50px_-10px_rgba(0,0,0,0.5)] relative flex flex-col rotate-[0.5deg] pb-20">

<span class="font-typewriter-md text-typewriter-md text-on-surface">CASE CLOSED</span>
</div>
<!-- Header Section -->

<div class="flex items-center gap-2 mb-2 justify-center">
<span class="material-symbols-outlined text-4xl text-on-surface" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
<span class="font-display-xl text-display-xl text-on-surface tracking-tighter uppercase">WINNER</span>
</div>
<div class="mt-4 relative">
<div class="font-handwritten-lg text-handwritten-lg text-ink-blue text-center bg-white px-6 py-4 border-2 border-black hard-shadow rotate-[-2deg]">

                </div>

                </div>
</div>
</header>
<!-- Final Roles List -->
<section class="p-margin-dossier flex-1">
<h2 class="font-typewriter-md text-typewriter-md border-b-2 border-black pb-2 mb-4">SUBJECT DISPOSITIONS</h2>
<div class="space-y-4">
<!-- Alive Player -->

</div>
<div class="text-right flex flex-col items-end">

<span class="font-label-caps text-label-caps text-green-700 mt-1">ALIVE</span>
</div>
</article>
<!-- Dead Player (Mafia) -->

<div class="w-16 h-16 bg-white border-2 border-black flex-shrink-0 flex items-center justify-center relative"><span class="material-symbols-outlined text-4xl text-black">fingerprint</span><div class="absolute inset-0 bg-red-900/30"></div><span class="material-symbols-outlined absolute text-4xl text-red-600 drop-shadow-md">close</span></div>
<div class="flex-1">

</div>
<div class="text-right flex flex-col items-end">
<span class="material-symbols-outlined text-stamp-red" style="font-variation-settings: 'FILL' 1;">skull</span>

</div>
<div class="absolute top-1 right-1/2 translate-x-1/2 opacity-70">

</article>

<span class="material-symbols-outlined">home</span>
                RETURN TO DESK
            </button>
</div>
</main>
<script>
        // Simple script to handle button press effect if needed beyond CSS
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', function() {
                this.style.transform = 'translate(4px, 4px) rotate(-1deg)';
                this.style.boxShadow = 'none';
            });
            btn.addEventListener('mouseup', function() {
                this.style.transform = 'rotate(-1deg)';
                this.style.boxShadow = '4px 4px 0px #000000';
            });
            btn.addEventListener('mouseleave', function() {
                this.style.transform = 'rotate(-1deg)';
                this.style.boxShadow = '4px 4px 0px #000000';
            });
        });
    </script>
