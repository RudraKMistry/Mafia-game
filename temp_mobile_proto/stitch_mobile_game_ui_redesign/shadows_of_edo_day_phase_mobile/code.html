<script>
        // Simple Sakura falling effect
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('sakura-container');
            const petalCount = 15;
            
            for (let i = 0; i < petalCount; i++) {
                createPetal();
            }

            function createPetal() {
                const petal = document.createElement('div');
                petal.classList.add('absolute', 'sakura-fall');
                
                // Randomize appearance
                const size = Math.random() * 10 + 5;
                const left = Math.random() * 100;
                const duration = Math.random() * 5 + 5;
                const delay = Math.random() * 10;
                
                petal.style.width = `${size}px`;
                petal.style.height = `${size * 1.5}px`;
                petal.style.left = `${left}%`;
                petal.style.animationDuration = `${duration}s`;
                petal.style.animationDelay = `-${delay}s`; // start midway
                
                // Petal shape using CSS
                petal.style.backgroundColor = '#ffb7c5'; // sakura-pink
                petal.style.borderRadius = '100% 0% 100% 0%';
                petal.style.opacity = '0.7';

                container.appendChild(petal);
            }
        });
    </script>
