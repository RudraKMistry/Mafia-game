<style>
        .texture-overlay {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            pointer-events: none;
        }
        
        .enso-bg {
            background-image: radial-gradient(circle at center, rgba(139, 0, 0, 0.05) 0%, transparent 60%);
        }

        .sakura-petal {
            position: absolute;
            background-color: #ffb7c5;
            border-radius: 150% 0 150% 0;
            opacity: 0.7;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(110vh) translateX(20vw) rotate(360deg);
                opacity: 0;
            }
        }
        
        .ink-mask {
            mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M5,50 Q20,30 50,50 T95,50 Q80,70 50,50 T5,50 Z"/></svg>');
            mask-size: 100% 100%;

<script>
        // Simple Sakura Particle System
        const container = document.getElementById('sakura-container');
        const petalCount = 15;

        for (let i = 0; i < petalCount; i++) {
            createPetal();
        }

        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('sakura-petal');
            
            // Random properties
            const size = Math.random() * 8 + 6; // 6px to 14px
            const left = Math.random() * 100; // 0% to 100%
            const duration = Math.random() * 5 + 5; // 5s to 10s
            const delay = Math.random() * 10; // 0s to 10s
            
            petal.style.width = `${size}px`;
            petal.style.height = `${size * 1.5}px`;
            petal.style.left = `${left}vw`;
            petal.style.animationDuration = `${duration}s`;
            petal.style.animationDelay = `${delay}s`;
            
            container.appendChild(petal);
        }
    </script>
