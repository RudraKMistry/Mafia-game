<style>
        .noise-bg {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }
        
        /* Particle animation setup */
        @keyframes fireflyFloat {
            0% { transform: translate(0, 0) scale(1); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translate(calc(var(--tx) * 10px), calc(var(--ty) * -10px)) scale(0.5); opacity: 0; }
        }

        .particle {
            position: absolute;
            background: #ccff00; /* lime-glow */
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 8px 2px rgba(204, 255, 0, 0.4);
            animation: fireflyFloat var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
            width: var(--size);
            height: var(--size);
            left: var(--x);
            top: var(--y);
        }

        /* Shoji Card Styles */
        .shoji-frame {
            background: linear-gradient(135deg, #28180b, #1f1b15);
            padding: 8px;
            position: relative;
        }
        
        .shoji-paper {
            background-color: #fdfbf7;
            position: relative;
            overflow: hidden;
        }

        .shoji-paper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(90deg, rgba(40,24,11,0.1) 1px, transparent 1px),
                linear-gradient(rgba(40,24,11,0.1) 1px, transparent 1px);
            background-size: 50% 33.33%;
            pointer-events: none;
        }

        .writing-vertical {
            writing-mode: vertical-rl;
            text-orientation: upright;
        }

        /* Ink Splatter effect */
        .ink-splatter {
            mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M40,50 Q45,20 60,30 T80,50 Q75,80 60,70 T40,50' fill='black'/%3E%3C/svg%3E");
            mask-size: cover;
            -webkit-mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M40,50 Q45,20 60,30 T80,50 Q75,80 60,70 T40,50' fill='black'/%3E%3C/svg%3E");
            -webkit-mask-size: cover;
        }

        .slash-mark {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120%;
            height: 4px;
            background-color: #93000a; /* on-error-container */
            transform: translate(-50%, -50%) rotate(-45deg);
            box-shadow: 0 0 10px rgba(147, 0, 10, 0.8);
            z-index: 10;
        }

        /* Brush stroke border */
        .brush-border {
            border: solid 2px transparent;
            border-image: linear-gradient(to right, transparent, #8b0000, transparent) 1;
        }

<script>
        // Simple Particle System generator
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('particle-container');
            const numParticles = 20;

            for (let i = 0; i < numParticles; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Randomize properties
                const size = Math.random() * 3 + 1 + 'px';
                const x = Math.random() * 100 + 'vw';
                const y = Math.random() * 100 + 'vh';
                const duration = Math.random() * 4 + 3 + 's';
                const delay = Math.random() * 5 + 's';
                const tx = (Math.random() - 0.5) * 10;
                const ty = (Math.random() - 0.5) * 10;

                particle.style.setProperty('--size', size);
                particle.style.setProperty('--x', x);
                particle.style.setProperty('--y', y);
                particle.style.setProperty('--duration', duration);
                particle.style.setProperty('--delay', delay);
                particle.style.setProperty('--tx', tx);
                particle.style.setProperty('--ty', ty);

                container.appendChild(particle);
            }
        });
    </script>
<style>
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
