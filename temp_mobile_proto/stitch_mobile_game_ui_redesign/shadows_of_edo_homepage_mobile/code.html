<style>
        body {
            background-color: theme('colors.night-bg-end');
            color: theme('colors.washi-paper');
        }
        
        /* Lantern Glow Effect */
        .lantern-glow {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139, 0, 0, 0.4) 0%, rgba(139, 0, 0, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* Firefly Particles */
        .firefly {
            position: absolute;
            background-color: theme('colors.lime-glow');
            width: 3px;
            height: 3px;
            border-radius: 50%;
            box-shadow: 0 0 6px 2px theme('colors.lime-glow');
            opacity: 0;
            animation: float 10s infinite ease-in-out;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translate(0, 0); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translate(var(--tx), var(--ty)); opacity: 0; }
        }

        /* Generate multiple fireflies with different starting positions and movements via inline JS later */

        .wooden-plaque {
            background: linear-gradient(135deg, theme('colors.tertiary') 0%, #2a1c11 100%);
            border: 2px solid #1a1008;
            box-shadow: 
                0 10px 15px -3px rgba(0, 0, 0, 0.8),
                inset 0 2px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            transition: all 0.3s ease;
        }

        .wooden-plaque::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.5;
            pointer-events: none;
        }
        
        .wooden-plaque:active {
            transform: scale(0.95) translateY(4px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.8);
        }

        .plaque-rope {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 20px;
            border: 2px solid theme('colors.on-surface-variant');
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            z-index: -1;
        }

        .text-glow {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

<script>
        // Generate Fireflies
        const firefliesContainer = document.getElementById('fireflies');
        const numFireflies = 25;

        for (let i = 0; i < numFireflies; i++) {
            const firefly = document.createElement('div');
            firefly.className = 'firefly';
            
            // Randomize starting position
            const startX = Math.random() * 100;
            const startY = Math.random() * 100;
            
            // Randomize movement distance and direction
            const tx = (Math.random() - 0.5) * 200 + 'px';
            const ty = (Math.random() - 0.5) * 200 - 100 + 'px'; // Tend upwards
            
            // Randomize animation duration and delay
            const duration = 5 + Math.random() * 10 + 's';
            const delay = Math.random() * 10 + 's';

            firefly.style.left = startX + 'vw';
            firefly.style.top = startY + 'vh';
            firefly.style.setProperty('--tx', tx);
            firefly.style.setProperty('--ty', ty);
            firefly.style.animationDuration = duration;
            firefly.style.animationDelay = delay;

            firefliesContainer.appendChild(firefly);
        }
    </script>
